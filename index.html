<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Mensagens Operacionais</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <img src="assets/logo-esquerda.png" alt="Logo" class="logo" width="125" height="31">
  <img src="assets/logo-apisul.png" alt="Grupo Apisul" class="logo" width="101" height="34">
</header>

<main>
  <section class="panel" aria-labelledby="t-dados">
    <h2 id="t-dados">Dados do alerta</h2>

    <div class="field">
      <label for="os">Ordem de serviço</label>
      <input type="text" id="os" class="upper" placeholder="6SSZ539925A" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <div class="field" id="boxPlaca">
      <label for="placa">Placa</label>
      <input type="text" id="placa" class="upper" maxlength="7" placeholder="ABC1D23" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="alerta">Tipo de alerta</label>
      <select id="alerta">
        <option value="">Selecione o alerta</option>
        <option value="perda">Perda de sinal</option>
        <option value="semEspelhamento">Sem espelhamento</option>
        <option value="atraso">Atraso de viagem</option>
        <option value="atrasoInicio">Atraso no início da viagem</option>
      </select>
    </div>

    <div class="field hidden" id="boxCliente">
      <label for="cliente">Cliente</label>
      <select id="cliente"></select>
    </div>

    <div class="field" id="boxTec">
      <label for="tec">Tecnologia</label>
      <select id="tec">
        <option value="">Selecione a tecnologia</option>
        <option>ONIXSAT</option>
        <option>SASCAR</option>
        <option>OMNILINK</option>
        <option>PÓSITRON</option>
        <option>AUTOTRAC</option>
        <option>SIGHRA</option>
      </select>
    </div>

    <div class="field" id="boxData">
      <label for="data" id="lblData">Horário/data</label>
      <div class="row dt-wrap">
        <input type="hidden" id="data">
        <button type="button" class="dt-trigger" id="dtTrigger" aria-haspopup="dialog" aria-expanded="false">
          <span id="dtText" class="dt-placeholder">Selecione data e horário</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6b7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        </button>
        <button type="button" class="btn-now" id="btnAgora" title="Preencher com a data e hora atuais">Agora</button>

        <div class="dt-pop hidden" id="dtPop" role="dialog" aria-label="Selecionar data e horário">
          <div class="dt-head">
            <button type="button" class="dt-nav" data-act="prev" aria-label="Mês anterior">&#8249;</button>
            <div class="dt-title" id="dtTitle"></div>
            <button type="button" class="dt-nav" data-act="next" aria-label="Próximo mês">&#8250;</button>
          </div>
          <div class="dt-week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
          <div class="dt-grid" id="dtGrid"></div>
          <div class="dt-time">
            <span class="dt-time-label">Horário</span>
            <div class="dt-spin">
              <button type="button" data-act="h+" aria-label="Aumentar hora">&#9650;</button>
              <input type="text" inputmode="numeric" maxlength="2" id="dtH" aria-label="Hora">
              <button type="button" data-act="h-" aria-label="Diminuir hora">&#9660;</button>
            </div>
            <span class="dt-colon">:</span>
            <div class="dt-spin">
              <button type="button" data-act="m+" aria-label="Aumentar minutos">&#9650;</button>
              <input type="text" inputmode="numeric" maxlength="2" id="dtM" aria-label="Minutos">
              <button type="button" data-act="m-" aria-label="Diminuir minutos">&#9660;</button>
            </div>
          </div>
          <div class="dt-foot">
            <div>
              <button type="button" class="dt-link" data-act="agora">Agora</button>
              <button type="button" class="dt-link dt-link-muted" data-act="limpar">Limpar</button>
            </div>
            <button type="button" class="dt-ok" data-act="ok">Confirmar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="label" id="lbl-saud">Saudação</span>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-saud">
        <label><input type="radio" name="saud" value="Bom dia"><span>Bom dia</span></label>
        <label><input type="radio" name="saud" value="Boa tarde"><span>Boa tarde</span></label>
        <label><input type="radio" name="saud" value="Boa noite"><span>Boa noite</span></label>
      </div>
    </div>
  </section>

  <section class="panel result-panel" aria-labelledby="t-res">
    <h2 id="t-res">Tratativa para ocorrência</h2>
    <div class="result empty" id="resultado" aria-live="polite">Selecione o tipo de alerta para gerar a mensagem.</div>
    <p class="hint" id="dica"></p>

    <div class="actions">
      <button type="button" class="btn-copy" id="btnCopiar" disabled>COPIAR TEXTO</button>
      <button type="button" class="btn-clear" id="btnLimpar">LIMPAR CAMPOS</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
